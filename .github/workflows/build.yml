# Builds all 17 Abyss packages in dependency order in the official archlinux image,
# installing each one before the next is built. The packages are attached to the run.
name: Build packages

on:
  push:
    branches: [main]
    paths: ["packages/**", "sources.json", "catalog.json", ".github/workflows/build.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 300
    steps:
      - name: Install build tools and a build user
        run: |
          pacman -Syu --noconfirm --needed base-devel git sudo python
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder

      - uses: actions/checkout@v4

      - name: Build and install every package
        run: |
          set -eu
          chown -R builder: .
          export MAKEFLAGS="-j$(nproc)"
          order=$(python3 -c 'import json; s=json.load(open("sources.json")); c=json.load(open("catalog.json")); print(" ".join(c["packages"][p["repo"]]["name"] for p in s["packages"]))')
          for p in $order; do
            echo "::group::$p"
            (cd "packages/$p" && sudo -u builder --preserve-env=MAKEFLAGS makepkg -si --noconfirm)
            echo "::endgroup::"
          done
          mkdir -p pkgs
          cp packages/*/*.pkg.tar.zst pkgs/

      - uses: actions/upload-artifact@v4
        with:
          name: arch-packages
          path: pkgs/*.pkg.tar.zst

  # Signs the packages and publishes them to the pacman repository AbyssWM/arch (GitHub Pages).
  # Needs the secrets ARCH_SIGNING_KEY (armored private GPG key) and ARCH_REPO_DEPLOY_KEY
  # (SSH deploy key with write access to AbyssWM/arch); without them it does nothing.
  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      SIGNING_KEY: ${{ secrets.ARCH_SIGNING_KEY }}
      DEPLOY_KEY: ${{ secrets.ARCH_REPO_DEPLOY_KEY }}
      KEY_ID: 7429EE25FE7F6A87620632B360D0CDE7A027F6A6
    steps:
      - name: Check for the secrets
        id: secrets
        run: |
          if [ -n "$SIGNING_KEY" ] && [ -n "$DEPLOY_KEY" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "Secrets not set, skipping"; fi

      - name: Install tools
        if: steps.secrets.outputs.ok == 'true'
        run: pacman -Syu --noconfirm --needed git gnupg openssh

      - uses: actions/download-artifact@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          name: arch-packages
          path: pkgs

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          repository: AbyssWM/arch
          ssh-key: ${{ secrets.ARCH_REPO_DEPLOY_KEY }}
          path: repo

      - name: Sign, add to the database and push
        if: steps.secrets.outputs.ok == 'true'
        run: |
          set -eu
          git config --global --add safe.directory '*'
          export GNUPGHOME="$(mktemp -d)"
          printf '%s\n' "$SIGNING_KEY" | gpg --batch --import
          cd repo
          for pkg in ../pkgs/*.pkg.tar.zst; do
            cp "$pkg" .
            gpg --batch --yes --detach-sign --local-user "$KEY_ID" "$(basename "$pkg")"
          done
          # -R removes the files of replaced versions; GitHub Pages serves no symlinks, so the
          # database links become real files
          repo-add --sign --key "$KEY_ID" -R abyss.db.tar.gz $(cd ../pkgs && ls *.pkg.tar.zst)
          for f in abyss.db abyss.db.sig abyss.files abyss.files.sig; do
            [ -L "$f" ] && cp --remove-destination "$(readlink "$f")" "$f"
          done
          gpg --armor --export "$KEY_ID" > abyss.gpg
          git config user.name bb8TheRobot
          git config user.email bb8TheRobot@users.noreply.github.com
          git add -A
          git commit -m "Packages from arch-builds ${GITHUB_SHA::7}" || exit 0
          git push
